<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 活动地图 · 全国黑客松与 AI 峰会实时更新</title>
<meta name="description" content="全国 AI 黑客松、开发者大会与技术峰会的实时地图。定时自动抓取小红书、抖音、公众号与活动聚合站数据，点击城市查看当地活动。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">AI</span>
    <div class="brand-text">
      <strong>AI 活动地图</strong>
      <span class="brand-sub">全国黑客松 · 开发者大会 · 技术峰会</span>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="map" role="tab">全国地图</button>
    <button class="tab" data-view="calendar" role="tab">倒排日历</button>
    <button class="tab" data-view="articles" role="tab">AI 资讯</button>
    <button class="tab" data-view="watching" role="tab">我的关注 <span class="tab-badge" id="watchBadge" hidden>0</span></button>
  </nav>
  <div class="topbar-right">
    <div class="sync-status" id="syncStatus" title="数据更新时间">
      <span class="dot"></span><span id="syncText">加载中…</span>
    </div>
  </div>
</header>

<!-- ============ 全国地图视图 ============ -->
<main class="view is-active" id="view-map">
  <div class="map-layout">
    <!-- 左：城市列表 -->
    <aside class="city-panel">
      <div class="panel-search">
        <input type="search" id="cityFilter" placeholder="搜索城市…" autocomplete="off">
      </div>
      <div class="city-list" id="cityList"></div>
      <div class="panel-foot">
        <span id="cityTotal">—</span>
      </div>
    </aside>

    <!-- 右：地图 -->
    <section class="map-stage">
      <div class="map-header">
        <div>
          <h1>全国 AI 活动地图</h1>
          <p class="map-sub" id="mapSub">点击地图上的城市，查看当地正在发生的 AI 活动</p>
        </div>
        <div class="map-tools">
          <label class="switch">
            <input type="checkbox" id="onlyUpcoming" checked>
            <span>只看未来活动</span>
          </label>
          <div class="legend">
            <span class="legend-item"><i class="lg lg-hack"></i>黑客松</span>
            <span class="legend-item"><i class="lg lg-conf"></i>大会/峰会</span>
            <span class="legend-item"><i class="lg lg-salon"></i>沙龙/工作坊</span>
            <span class="legend-item"><i class="lg lg-meet"></i>社区聚会</span>
          </div>
        </div>
        <div class="site-stats" id="siteStats"></div>
      </div>

      <div class="map-wrap" id="mapWrap">
        <svg id="chinaMap" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="全国 AI 活动分布地图">
          <defs>
            <filter id="mapShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
            </filter>
            <radialGradient id="markerGlow">
              <stop offset="0%" stop-color="#b06bff" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#b06bff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g id="mapProvinces" filter="url(#mapShadow)"></g>
          <g id="mapSouthSea"></g>
          <g id="mapMarkers"></g>        </svg>
        <div class="map-tooltip" id="mapTooltip" hidden></div>
        <div class="map-loading" id="mapLoading">地图加载中…</div>
      </div>
    </section>
  </div>
</main>

<!-- ============ 城市详情视图 ============ -->
<main class="view" id="view-city">
  <div class="city-hero" id="cityHero">
    <div class="hero-toolbar">
      <button class="back-btn" id="cityBack">← 返回全国地图</button>
      <button class="hero-toggle" id="heroToggle" aria-expanded="true">收起头部 ▲</button>
    </div>
    <div class="hero-mini" id="heroMini">
      <span class="hero-mini-name" id="heroMiniName">北京</span>
      <span class="hero-mini-sub" id="heroMiniSub">7 场即将开始 · 点右侧展开详情</span>
    </div>
    <div class="hero-grid">
      <div class="hero-main">
        <h1 id="cityName">上海</h1>
        <p class="hero-tagline" id="cityTagline">AI 活动地图</p>
        <div class="hero-stats" id="cityStats"></div>
      </div>
      <div class="hero-side">
        <div class="hero-count" id="cityCount"></div>
      </div>
    </div>
  </div>

  <!-- 城市速览总结：不用点进详情就能看懂 -->
  <section class="city-summary-band" id="cityBand">
    <div class="band-block">
      <h3>城市速览</h3>
      <p class="band-text" id="bandText"></p>
      <div class="band-chips" id="bandChips"></div>
    </div>
    <div class="band-block">
      <h3>关键信息</h3>
      <div class="band-facts" id="bandFacts"></div>
    </div>
  </section>

  <div class="city-body">
    <!-- 活动卡片流 -->
    <section class="city-events" id="cityEvents"></section>

    <!-- 编号汇总表（仿海报底部） -->
    <section class="city-summary">
      <h2 class="section-title">活动一览</h2>
      <div class="summary-table" id="citySummary"></div>
    </section>
  </div>
</main>

<!-- ============ 倒排日历视图 ============ -->
<main class="view" id="view-calendar">
  <div class="calendar-head">
    <h1>倒排日历</h1>
    <p class="map-sub">按日期倒序排列的全部 AI 活动 · 越靠上越紧急</p>
    <div class="cal-filters" id="calFilters">
      <button class="chip is-active" data-type="all">全部</button>
      <button class="chip" data-type="hackathon">黑客松</button>
      <button class="chip" data-type="conference">大会/峰会</button>
      <button class="chip" data-type="salon">沙龙/工作坊</button>
      <button class="chip" data-type="meetup">社区聚会</button>
      <button class="chip" data-type="mine">我关注的</button>
    </div>
  </div>
  <div class="calendar-list" id="calendarList"></div>
</main>

<!-- ============ 我的关注视图 ============ -->
<main class="view" id="view-watching">
  <div class="watch-head">
    <h1>我的关注</h1>
    <p class="map-sub">收藏的活动与自定义倒计时，保存在本地浏览器</p>
    <div class="watch-actions">
      <button class="btn btn-primary" id="addCustomBtn">+ 添加自定义倒计时</button>
    </div>
  </div>
  <div class="watch-grid" id="watchGrid"></div>
</main>

<!-- ============ AI 资讯视图 ============ -->
<main class="view" id="view-articles">
  <div class="articles-head">
    <h1>AI 资讯</h1>
    <p class="map-sub">Agent 经济与 AI 生态的一线文章 · 黑客松主办方动态 + 技术媒体 · 每日自动更新</p>
    <div class="art-filters" id="artFilters"></div>
    <div class="art-filters art-cats" id="artCats"></div>
  </div>
  <div class="articles-list" id="articlesList"></div>
</main>

<!-- ============ 文章阅读器弹窗 ============ -->
<div class="modal" id="articleModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="关闭">×</button>
    <div class="modal-body" id="articleBody"></div>
  </div>
</div>

<!-- ============ 活动详情弹窗 ============ -->
<div class="modal" id="eventModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" data-close aria-label="关闭">×</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ============ 自定义倒计时弹窗 ============ -->
<div class="modal" id="customModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel modal-sm" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="关闭">×</button>
    <h2 class="modal-title">添加自定义倒计时</h2>
    <form id="customForm" class="custom-form">
      <label>名称
        <input type="text" name="title" required placeholder="例如：提交黑客松作品" maxlength="40">
      </label>
      <label>日期
        <input type="date" name="date" required>
      </label>
      <label>备注（可选）
        <input type="text" name="note" placeholder="例如：作品提交截止" maxlength="60">
      </label>
      <button type="submit" class="btn btn-primary btn-block">添加</button>
    </form>
  </div>
</div>

<script src="data/map-paths.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
